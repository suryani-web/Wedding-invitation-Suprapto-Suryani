    <!-- =========================
     8. RESERVASI / RSVP
========================== -->
<section id="reservasi" class="page reservasi-page">

    <div class="rsvp-form-card">

        <div class="rsvp-form-group">
            <label for="namaTamu">Nama Anda</label>
            <input
                type="text"
                id="namaTamu"
                placeholder="Masukkan nama Anda"
            >
        </div>

        <div class="rsvp-form-group">
            <label for="jumlahTamu">Jumlah Kehadiran</label>
            <select id="jumlahTamu">
                <option value="1">1 Orang</option>
                <option value="2">2 Orang</option>
                <option value="3">3 Orang</option>
                <option value="4">4 Orang</option>
                <option value="5">5 Orang</option>
            </select>
        </div>

        <div class="rsvp-form-group">
            <label for="ucapanTamu">Ucapan & Doa</label>
            <textarea
                id="ucapanTamu"
                placeholder="Tuliskan ucapan atau doa untuk kami..."
            ></textarea>
        </div>

        <div class="rsvp-kehadiran">

            <button
                type="button"
                class="rsvp-pilihan aktif"
                data-status="Hadir"
            >
                <span>○</span>
                HADIR
            </button>

            <button
                type="button"
                class="rsvp-pilihan"
                data-status="Tidak Hadir"
            >
                <span>○</span>
                TIDAK HADIR
            </button>

        </div>

        <button
            type="button"
            id="btnKonfirmasi"
            class="rsvp-btn-konfirmasi"
        >
            KONFIRMASI KEHADIRAN
        </button>

        <p id="pesanKonfirmasi" class="rsvp-pesan"></p>

    </div>

</section>
